name: log-check

# No push trigger: pushes never start this check, so they cannot fail it.
# Runs on pull requests and on demand (Actions tab -> log-check -> Run workflow).
on:
  pull_request:
  workflow_dispatch:

jobs:
  logs:
    name: committed SAS logs are clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_logs.py
